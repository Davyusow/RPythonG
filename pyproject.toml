[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpythong"
version = "0.1.0"
description = "Um rpg simples e minimalista em python"
authors = [{name="Davyusow"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
